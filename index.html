        function closeStats() {
            document.getElementById('statsModal').classList.remove('active');
            Object.values(chartInstances).forEach(chart => { try { chart.destroy(); } catch (e) {} });
            chartInstances = {};
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const btn = document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`);
            if (btn) btn.classList.add('active');
            const content = document.getElementById(tabId);
            if (content) content.classList.add('active');

            setTimeout(() => {
                if (tabId === 'tab1') renderSummary();
                else if (tabId === 'tab2') renderChart2();
                else if (tabId === 'tab3') renderChart3();
                else if (tabId === 'tab4') renderProgressChart();
                else if (tabId === 'tab5') renderStatsTable();
            }, 150);
        }

        function renderStats() {
            setTimeout(() => {
                renderSummary();
                renderChart2();
                renderChart3();
                renderProgressChart();
                renderStatsTable();
            }, 200);
        }

        function renderSummary() {
            const filtered = getFilteredActivities();
            const total = filtered.length;
            const totalImages = filtered.reduce((sum, a) => sum + (a.images ? a.images.length : 0), 0);
            
            const cardsHtml = `
                <div class="stat-card"><div class="number">${persianNumber(total)}</div><div class="label">کل فعالیت‌ها</div></div>
                <div class="stat-card"><div class="number">${persianNumber(totalImages)}</div><div class="label">کل تصاویر</div></div>
                ${areas.map(area => {
                    const count = filtered.filter(a => a.area === area).length;
                    return `
                        <div class="stat-card" style="border-right-color: ${['#1976D2','#2E7D32','#F57C00'][areas.indexOf(area)]};">
                            <div class="number">${persianNumber(count)}</div>
                            <div class="label">${area}</div>
                        </div>
                    `;
                }).join('')}
            `;
            document.getElementById('summaryCards').innerHTML = cardsHtml;

            const counts = areas.map(a => filtered.filter(act => act.area === a).length);
            const colors = ['#1976D2', '#2E7D32', '#F57C00', '#6A1B9A', '#00838F', '#D32F2F'];
            const data = counts.filter(c => c > 0);
            const labels = areas.filter((_, i) => counts[i] > 0);

            if (chartInstances.chart1) { try { chartInstances.chart1.destroy(); } catch (e) {} }
            const canvas = document.getElementById('chart1');
            if (!canvas) { console.error('chart1 پیدا نشد'); return; }
            
            const ctx = canvas.getContext('2d');
            chartInstances.chart1 = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: colors.slice(0, data.length), borderColor: 'white', borderWidth: 2 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 13 } } },
                        title: { display: true, text: `توزیع فعالیت‌ها (${getRangeText()})`, font: { size: 16 } }
                    }
                }
            });
        }

        function renderChart2() {
            try {
                const area = document.getElementById('trendArea').value;
                const period = document.getElementById('trendPeriod').value;

                let filtered = getFilteredActivities();
                if (area !== 'all') filtered = filtered.filter(a => a.area === area);

                if (chartInstances.chart2) { try { chartInstances.chart2.destroy(); } catch (e) {} }
                const canvas = document.getElementById('chart2');
                if (!canvas) { console.error('chart2 پیدا نشد'); return; }
                
                const ctx = canvas.getContext('2d');

                if (filtered.length === 0) {
                    chartInstances.chart2 = new Chart(ctx, {
                        type: 'line',
                        data: { labels: ['هیچ داده‌ای وجود ندارد'], datasets: [{ data: [0], backgroundColor: 'transparent' }] },
                        options: { plugins: { legend: { display: false } } }
                    });
                    return;
                }

                const dateCounts = {};
                filtered.forEach(act => {
                    const parts = act.date.split(' ');
                    if (parts.length === 3) {
                        let key;
                        const day = parseInt(parts[0]);
                        const month = persianMonths.indexOf(parts[1]) + 1;
                        const year = parseInt(parts[2]);

                        if (period === 'daily') key = `${year}/${month.toString().padStart(2, '0')}/${day.toString().padStart(2, '0')}`;
                        else if (period === 'weekly') {
                            const week = Math.ceil(day / 7);
                            key = `${year}/${month.toString().padStart(2, '0')}/هفته${week}`;
                        } else {
                            key = `${year}/${month.toString().padStart(2, '0')}`;
                        }
                        dateCounts[key] = (dateCounts[key] || 0) + 1;
                    }
                });

                const sortedKeys = Object.keys(dateCounts).sort();
                const sortedData = sortedKeys.map(k => dateCounts[k]);

                chartInstances.chart2 = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedKeys,
                        datasets: [{
                            label: 'تعداد فعالیت‌ها',
                            data: sortedData,
                            borderColor: '#1976D2',
                            backgroundColor: 'rgba(25, 118, 210, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#1976D2',
                            pointRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            title: { display: true, text: `روند فعالیت‌ها (${area === 'all' ? 'همه حوزه‌ها' : area})`,
                                font: { size: 16 } }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'تعداد فعالیت' } },
                            x: { title: { display: true, text: 'بازه زمانی' }, ticks: { maxTicksLimit: 15 } }
                        }
                    }
                });
            } catch (e) {
                console.error('خطا در نمودار ۲:', e);
            }
        }

        function updateTrend() { renderChart2(); }

        function renderChart3() {
            try {
                const filtered = getFilteredActivities();
                const counts = areas.map(a => filtered.filter(act => act.area === a).length);
                const colors = ['#1976D2', '#2E7D32', '#F57C00', '#6A1B9A', '#00838F', '#D32F2F'];

                if (chartInstances.chart3) { try { chartInstances.chart3.destroy(); } catch (e) {} }
                const canvas = document.getElementById('chart3');
                if (!canvas) { console.error('chart3 پیدا نشد'); return; }
                
                const ctx = canvas.getContext('2d');
                chartInstances.chart3 = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: areas,
                        datasets: [{
                            label: 'تعداد فعالیت‌ها',
                            data: counts,
                            backgroundColor: colors.slice(0, areas.length),
                            borderColor: '#0D47A1',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            title: { display: true, text: `تعداد فعالیت‌ها بر اساس حوزه (${getRangeText()})`,
                                font: { size: 16 } }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'تعداد فعالیت' } },
                            x: { title: { display: true, text: 'حوزه فعالیت' } }
                        }
                    }
                });
            } catch (e) {
                console.error('خطا در نمودار ۳:', e);
            }
        }

        function addCustomRange() {
            const container = document.getElementById('customRangesContainer');
            const newItem = document.createElement('div');
            newItem.className = 'custom-range-item';
            
            const days = Array.from({ length: 31 }, (_, i) => persianNumber(i + 1));
            const years = Array.from({ length: 21 }, (_, i) => persianNumber(1400 + i));
            const dayOptions = days.map(d => `<option>${d}</option>`).join('');
            const monthOptions = persianMonths.map(m => `<option>${m}</option>`).join('');
            const yearOptions = years.map(y => `<option>${y}</option>`).join('');
            
            newItem.innerHTML = `
                <label>از:</label>
                <select class="customStartDay">${dayOptions}</select>
                <select class="customStartMonth">${monthOptions}</select>
                <select class="customStartYear">${yearOptions}</select>
                <label>تا:</label>
                <select class="customEndDay">${dayOptions}</select>
                <select class="customEndMonth">${monthOptions}</select>
                <select class="customEndYear">${yearOptions}</select>
                <button onclick="removeCustomRange(this)" style="background:#D32F2F; color:white; border:none; border-radius:4px; padding:2px 8px; cursor:pointer;">✕</button>
            `;
            container.appendChild(newItem);
        }

        function removeCustomRange(btn) {
            const container = document.getElementById('customRangesContainer');
            if (container.children.length > 1) {
                btn.parentElement.remove();
            } else {
                showToast('حداقل یک بازه باید وجود داشته باشد!', 'warning');
            }
        }

        function toggleProgressRange() {
            const rangeType = document.getElementById('progressRangeType').value;
            const monthSelector = document.getElementById('progressMonthSelector');
            const dateRange = document.getElementById('progressDateRange');
            
            if (rangeType === 'custom') {
                monthSelector.style.display = 'none';
                dateRange.style.display = 'flex';
                dateRange.style.flexDirection = 'column';
                dateRange.style.alignItems = 'flex-start';
                dateRange.style.gap = '5px';
            } else {
                monthSelector.style.display = 'inline-flex';
                monthSelector.style.flexWrap = 'wrap';
                monthSelector.style.alignItems = 'center';
                monthSelector.style.gap = '5px';
                dateRange.style.display = 'none';
                updateProgressMonths();
            }
        }

        function updateProgressMonths() {
            const periodType = parseInt(document.getElementById('progressPeriodType').value) || 30;
            const select = document.getElementById('progressMonths');
            
            const now = new Date();
            const currentJd = toJalaali(now.getFullYear(), now.getMonth() + 1, now.getDate());
            const currentMonth = currentJd.jm;
            const currentYear = currentJd.jy;
            
            const numMonths = periodType === 15 ? 6 : 12;
            select.innerHTML = '';
            
            for (let i = 0; i < numMonths; i++) {
                let month = currentMonth - i;
                let year = currentYear;
                if (month <= 0) { month += 12; year--; }
                const monthName = persianMonths[month - 1];
                const option = document.createElement('option');
                option.value = `${monthName} ${year}`;
                option.textContent = `${monthName} ${persianNumber(year)}`;
                option.selected = (i < 4);
                select.appendChild(option);
            }
        }

        function renderProgressChart() {
            try {
                const rangeType = document.getElementById('progressRangeType').value;
                const selectedAreas = Array.from(document.getElementById('progressAreas').selectedOptions).map(o => o.value);
                
                if (selectedAreas.length === 0) {
                    showToast('حداقل یک حوزه را انتخاب کنید!', 'warning');
                    return;
                }
                
                let labels = [];
                let dateRanges = [];
                
                if (rangeType === 'custom') {
                    const items = document.querySelectorAll('#customRangesContainer .custom-range-item');
                    if (items.length === 0) {
                        showToast('حداقل یک بازه را تعریف کنید!', 'warning');
                        return;
                    }
                    items.forEach(item => {
                        const startDay = item.querySelector('.customStartDay').value;
                        const startMonth = item.querySelector('.customStartMonth').value;
                        const startYear = item.querySelector('.customStartYear').value;
                        const endDay = item.querySelector('.customEndDay').value;
                        const endMonth = item.querySelector('.customEndMonth').value;
                        const endYear = item.querySelector('.customEndYear').value;
                        
                        const startNum = persianDateToNumber(`${startDay} ${startMonth} ${startYear}`);
                        const endNum = persianDateToNumber(`${endDay} ${endMonth} ${endYear}`);
                        
                        if (startNum > endNum) {
                            showToast(`تاریخ شروع نباید از تاریخ پایان بزرگتر باشد!`, 'warning');
                            return;
                        }
                        labels.push(`از ${startDay} ${startMonth} ${startYear} تا ${endDay} ${endMonth} ${endYear}`);
                        dateRanges.push({ startNum, endNum });
                    });
                } else {
                    const periodType = parseInt(document.getElementById('progressPeriodType').value);
                    const selectedMonths = Array.from(document.getElementById('progressMonths').selectedOptions).map(o => o.value);
                    
                    if (selectedMonths.length < 2) {
                        showToast('حداقل دو ماه را انتخاب کنید!', 'warning');
                        return;
                    }
                    
                    const sortedMonths = selectedMonths.sort((a, b) => {
                        const partsA = a.split(' ');
                        const partsB = b.split(' ');
                        const monthA = persianMonths.indexOf(partsA[0]) + 1;
                        const monthB = persianMonths.indexOf(partsB[0]) + 1;
                        const yearA = parseInt(partsA[1]);
                        const yearB = parseInt(partsB[1]);
                        if (yearA !== yearB) return yearA - yearB;
                        return monthA - monthB;
                    });
                    
                    sortedMonths.forEach(month => {
                        const parts = month.split(' ');
                        const monthName = parts[0];
                        const yearStr = parts[1];
                        const year = parseInt(yearStr);
                        const monthNum = persianMonths.indexOf(monthName) + 1;
                        
                        const firstDay = 1;
                        let lastDay = 31;
                        if ([2, 4, 6, 9, 11, 12].includes(monthNum)) lastDay = 30;
                        if (monthNum === 6) lastDay = 31;
                        if (monthNum === 7) lastDay = 31;
                        if (monthNum === 8) lastDay = 31;
                        
                        const startNum = year * 10000 + monthNum * 100 + firstDay;
                        const endNum = year * 10000 + monthNum * 100 + lastDay;
                        
                        if (periodType === 15) {
                            const midNum = year * 10000 + monthNum * 100 + 15;
                            labels.push(`نیمه اول ${monthName} ${yearStr}`);
                            dateRanges.push({ startNum: startNum, endNum: midNum });
                            labels.push(`نیمه دوم ${monthName} ${yearStr}`);
                            dateRanges.push({ startNum: midNum + 1, endNum: endNum });
                        } else {
                            labels.push(month);
                            dateRanges.push({ startNum: startNum, endNum: endNum });
                        }
                    });
                }
                
                const colors = ['#1976D2', '#2E7D32', '#F57C00', '#6A1B9A', '#00838F', '#D32F2F'];
                const datasets = [];
                let hasData = false;
                
                selectedAreas.forEach((area, idx) => {
                    const data = [];
                    dateRanges.forEach(range => {
                        let count = 0;
                        activities.forEach(act => {
                            const actNum = persianDateToNumber(act.date);
                            if (act.area === area && actNum >= range.startNum && actNum <= range.endNum) {
                                count++;
                            }
                        });
                        if (count > 0) hasData = true;
                        data.push(count);
                    });
                    datasets.push({
                        label: area,
                        data: data,
                        backgroundColor: colors[idx % colors.length] + '80',
                        borderColor: colors[idx % colors.length],
                        borderWidth: 2,
                        borderRadius: 4
                    });
                });
                
                const container = document.getElementById('progressChartContainer');
                
                if (!hasData) {
                    container.innerHTML = '<div class="no-data-msg">هیچ فعالیتی در بازه‌های انتخاب شده وجود ندارد</div>';
                    document.getElementById('progressSummary').innerHTML = '';
                    document.getElementById('progressDetails').innerHTML = '';
                    if (chartInstances.chart4) { try { chartInstances.chart4.destroy(); } catch (e) {} }
                    return;
                }
                
                container.innerHTML = '<div class="chart-container"><canvas id="chart4"></canvas></div>';
                if (chartInstances.chart4) { try { chartInstances.chart4.destroy(); } catch (e) {} }
                
                const canvas = document.getElementById('chart4');
                if (!canvas) { console.error('chart4 پیدا نشد'); return; }
                const ctx = canvas.getContext('2d');
                chartInstances.chart4 = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: labels, datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top', labels: { font: { size: 13 } } },
                            title: { display: true, text: 'تحلیل پیشرفت/پسرفت حوزه‌ها', font: { size: 16 } }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'تعداد فعالیت' }, ticks: { stepSize: 1 } },
                            x: { title: { display: true, text: 'بازه‌ها' } }
                        }
                    }
                });
                
                let summaryHtml = '<div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">';
                selectedAreas.forEach((area, idx) => {
                    const data = datasets[idx].data;
                    if (data.length >= 2) {
                        const first = data[0];
                        const last = data[data.length - 1];
                        const change = last - first;
                        const changePercent = first > 0 ? ((change / first) * 100).toFixed(1) : (change > 0 ? '100+' : '0');
                        const trend = change > 0 ? 'افزایش' : (change < 0 ? 'کاهش' : 'ثابت');
                        const color = change > 0 ? '#4CAF50' : (change < 0 ? '#f44336' : '#FF9800');
                        const icon = change > 0 ? '▲' : (change < 0 ? '▼' : '■');
                        summaryHtml += `
                            <span style="background:#F5F5F5; padding:5px 15px; border-radius:15px; border-right:4px solid ${color};">
                                <strong>${area}:</strong>
                                <span style="color:${color};font-weight:bold;">
                                    ${icon} ${trend} ${persianNumber(Math.abs(change))} فعالیت (${changePercent}%)
                                </span>
                            </span>
                        `;
                    }
                });
                summaryHtml += '</div>';
                document.getElementById('progressSummary').innerHTML = summaryHtml;
                
                let tableHtml = `
                    <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;">
                        <thead><tr style="background:#0D47A1; color:white;">
                            <th style="padding:8px;">حوزه</th>
                            ${labels.map(l => `<th style="padding:8px;">${l}</th>`).join('')}
                            <th style="padding:8px;">وضعیت</th>
                        </tr></thead><tbody>
                `;
                selectedAreas.forEach((area, idx) => {
                    const data = datasets[idx].data;
                    if (data.length >= 2) {
                        const first = data[0];
                        const last = data[data.length - 1];
                        const change = last - first;
                        const trend = change > 0 ? 'افزایش' : (change < 0 ? 'کاهش' : 'ثابت');
                        const color = change > 0 ? '#4CAF50' : (change < 0 ? '#f44336' : '#FF9800');
                        tableHtml += `
                            <tr style="border-bottom:1px solid #E0E0E0;">
                                <td style="padding:6px;font-weight:bold;">${area}</td>
                                ${data.map(d => `<td style="padding:6px;text-align:center;">${persianNumber(d)}</td>`).join('')}
                                <td style="padding:6px;text-align:center;color:${color};font-weight:bold;">${trend}</td>
                            </tr>
                        `;
                    }
                });
                tableHtml += `</tbody></table>`;
                document.getElementById('progressDetails').innerHTML = tableHtml;
                
            } catch (e) {
                console.error('خطا در نمودار پیشرفت:', e);
                showToast('خطا در رسم نمودار پیشرفت: ' + e.message, 'error');
            }
        }

        function renderStatsTable() {
            try {
                const filtered = getFilteredActivities();
                const total = filtered.length;
                const totalImages = filtered.reduce((sum, a) => sum + (a.images ? a.images.length : 0), 0);

                let html = `
                    <table style="width:100%; border-collapse:collapse; margin:10px 0;">
                        <tr style="background:#0D47A1; color:white;"><th style="padding:10px;">آمار</th><th style="padding:10px;">مقدار</th></tr>
                        <tr><td style="padding:8px; border-bottom:1px solid #E0E0E0;">کل فعالیت‌ها</td>
                            <td style="padding:8px; text-align:center;">${persianNumber(total)}</td></tr>
                        <tr><td style="padding:8px; border-bottom:1px solid #E0E0E0;">کل تصاویر</td>
                            <td style="padding:8px; text-align:center;">${persianNumber(totalImages)}</td></tr>
                        <tr><td style="padding:8px; border-bottom:1px solid #E0E0E0;">میانگین تصویر در فعالیت</td>
                            <td style="padding:8px; text-align:center;">${persianNumber(total > 0 ? (totalImages / total).toFixed(1) : '۰')}</td></tr>
                `;
                areas.forEach(area => {
                    const count = filtered.filter(a => a.area === area).length;
                    html += `<tr><td style="padding:8px; border-bottom:1px solid #E0E0E0;">${area}</td>
                            <td style="padding:8px; text-align:center;">${persianNumber(count)}</td></tr>`;
                });
                html += `</table>`;
                document.getElementById('statsTable').innerHTML = html;
            } catch (e) {
                console.error('خطا در جدول آمار:', e);
            }
        }

        // ============================================
        // پاک کردن همه
        // ============================================
        async function clearAll() {
            if (confirm('آیا مطمئن هستید که می‌خواهید همه داده‌ها را پاک کنید؟')) {
                try {
                    const result = await apiCall('/clear', 'POST');
                    if (result && result.success) {
                        showToast('همه داده‌ها پاک شدند');
                        await refreshList();
                    }
                } catch (error) { console.error('Error clearing data:', error); }
            }
        }

        document.addEventListener('DOMContentLoaded', init);
        console.log('برنامه وب گزارش عملکرد بارگذاری شد!');
    </script>
